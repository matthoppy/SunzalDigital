<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunzal SEO Control Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an operator's board. Slim top bar holds the range filter; the portfolio table leads,
   each site opens into stacked bands ordered by what a local business owner checks first. */
:root {
  --bg: #f3f5f4;
  --surface: #fcfcfb;
  --sunken: #eceeec;
  --fg: #111715;
  --fg-2: #4b5450;
  --muted: #7d8581;
  --line: #e0e3e0;
  --line-strong: #c5cbc7;
  --accent: #1c5cab;
  --accent-fg: #ffffff;
  --accent-wash: #e5eef9;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --warning-text: #7a5200;
  --serious: #ec835a;
  --critical: #d03b3b;
  --critical-text: #a92626;
  --pill-good: #e3f3e3;
  --pill-warn: #fdf1d6;
  --pill-crit: #fbe4e4;
  --pill-info: #e9ebf0;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1211; --surface: #181b1a; --sunken: #121514; --fg: #f4f6f5; --fg-2: #c0c6c2; --muted: #8b928e;
    --line: #2a2e2c; --line-strong: #3a3f3c; --accent: #6da7ec; --accent-fg: #0b1420; --accent-wash: #16263a;
    --series-1: #3987e5; --series-2: #d95926; --good-text: #3dc23d; --warning-text: #fab219; --critical-text: #ef7676;
    --pill-good: #142a16; --pill-warn: #2f2610; --pill-crit: #351819; --pill-info: #23262b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1211; --surface: #181b1a; --sunken: #121514; --fg: #f4f6f5; --fg-2: #c0c6c2; --muted: #8b928e;
  --line: #2a2e2c; --line-strong: #3a3f3c; --accent: #6da7ec; --accent-fg: #0b1420; --accent-wash: #16263a;
  --series-1: #3987e5; --series-2: #d95926; --good-text: #3dc23d; --warning-text: #fab219; --critical-text: #ef7676;
  --pill-good: #142a16; --pill-warn: #2f2610; --pill-crit: #351819; --pill-info: #23262b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-inline: 16px; padding-block: 0 48px;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.1; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; font-weight: 500; }
.mono { font-family: var(--font-data); font-size: 0.86em; }
.muted { color: var(--muted); }
.secondary { color: var(--fg-2); }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding: 10px 16px;
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
  font-size: 0.78rem; font-weight: 500; background: var(--pill-info); color: var(--fg-2); white-space: nowrap;
}
.chip.demo { background: var(--pill-warn); color: var(--warning-text); }
.chip.live { background: var(--pill-good); color: var(--good-text); }
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button {
  border: 0; background: transparent; padding: 4px 11px; border-radius: 6px; cursor: pointer;
  font-size: 0.85rem; color: var(--fg-2);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line-strong); }

.banner {
  margin: 14px 0 0; padding: 10px 14px; border-radius: var(--radius);
  background: var(--pill-warn); color: var(--fg); font-size: 0.9rem;
}

main { padding-top: 22px; display: grid; gap: 28px; }
.page-head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
.page-head .meta { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; color: var(--fg-2); font-size: 0.9rem; margin-top: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 14px; border-radius: 8px;
  cursor: pointer; font-size: 0.9rem; font-weight: 500;
}
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--critical-text); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 0.9rem; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.tile .label { font-size: 0.82rem; color: var(--fg-2); }
.tile .value { font-size: 1.65rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.tile .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.delta { font-size: 0.8rem; font-weight: 500; white-space: nowrap; }
.delta.up { color: var(--good-text); }
.delta.down { color: var(--critical-text); }
.delta.flat { color: var(--muted); }

/* bands */
.band { display: grid; gap: 12px; }
.band-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.band-head p { margin: 2px 0 0; color: var(--fg-2); font-size: 0.88rem; max-width: 65ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.panel.flush { padding: 0; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.empty { padding: 22px 16px; color: var(--fg-2); font-size: 0.9rem; }

/* tables */
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; font-weight: 500; font-size: 0.78rem; color: var(--muted); padding: 10px 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--sunken); }
tbody tr[aria-selected="true"] { background: var(--accent-wash); }
.site-cell b { display: block; font-weight: 600; }
.cell-url { max-width: 340px; overflow-wrap: anywhere; }
.pos { font-weight: 600; font-variant-numeric: tabular-nums; }
.pos.top3 { color: var(--good-text); }
@media (max-width: 680px) { .hide-sm { display: none; } }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--pill-good); color: var(--good-text); }
.pill.warning { background: var(--pill-warn); color: var(--warning-text); }
.pill.critical { background: var(--pill-crit); color: var(--critical-text); }
.pill.info { background: var(--pill-info); color: var(--fg-2); }

/* issues */
.issues { list-style: none; margin: 0; padding: 0; }
.issues li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
.issues li:last-child { border-bottom: 0; }
.issues .what { min-width: 0; overflow-wrap: anywhere; }
.issues .what small { display: block; color: var(--muted); }

/* charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.chart .baseline { stroke: var(--line-strong); stroke-width: 1; }
.chart .crosshair { stroke: var(--line-strong); stroke-width: 1; }
.tooltip {
  position: absolute; pointer-events: none; z-index: 3; min-width: 140px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 8px 10px; font-size: 0.82rem; box-shadow: 0 6px 18px rgb(0 0 0 / 0.12);
}
.tooltip .t-date { color: var(--muted); margin-bottom: 4px; }
.tooltip .t-row { display: flex; align-items: center; gap: 8px; }
.tooltip .t-row strong { font-variant-numeric: tabular-nums; min-width: 3ch; }
.tooltip .t-row span:last-child { color: var(--fg-2); }
.key { display: inline-block; width: 14px; height: 2px; border-radius: 2px; flex: none; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.82rem; color: var(--fg-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.spark { display: block; }

/* vitals */
.vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.vital { display: grid; gap: 6px; }
.vital .value { font-size: 1.5rem; font-weight: 600; }
.meter { position: relative; height: 6px; border-radius: 3px; display: flex; gap: 2px; }
.meter i { flex: 1; border-radius: 3px; opacity: 0.35; }
.meter i:nth-child(1) { background: var(--good); }
.meter i:nth-child(2) { background: var(--warning); }
.meter i:nth-child(3) { background: var(--critical); }
.meter b { position: absolute; top: -4px; width: 4px; height: 14px; border-radius: 2px; background: var(--fg); transform: translateX(-2px); }

/* uptime */
.uptime-strip { display: flex; gap: 2px; height: 30px; align-items: stretch; }
.uptime-strip i { flex: 1; border-radius: 2px; min-width: 2px; background: var(--good); }
.uptime-strip i.warn { background: var(--warning); }
.uptime-strip i.down { background: var(--critical); }
.uptime-strip i.none { background: var(--line); }

/* forms */
form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px 16px; }
label.field { display: grid; gap: 4px; font-size: 0.85rem; color: var(--fg-2); min-width: 0; }
label.field small { color: var(--muted); }
input[type="text"], textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
  padding: 7px 10px; font-size: 0.92rem; color: var(--fg);
}
textarea { min-height: 110px; font-family: var(--font-data); font-size: 0.85rem; }
.form-foot { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice { font-size: 0.88rem; }
.notice.error { color: var(--critical-text); }
.notice.ok { color: var(--good-text); }
details.settings > summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; list-style: none; }
details.settings > summary::-webkit-details-marker { display: none; }
details.settings > summary::after { content: " +"; color: var(--muted); }
details.settings[open] > summary::after { content: " –"; }
.kw-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.kw-list li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
.loading main { opacity: 0.55; transition: opacity 0.2s; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><b>Sunzal Digital</b><span>SEO control centre</span></div>
    <span id="mode-chip" class="chip">Connecting…</span>
    <div class="seg" role="group" aria-label="Date range" id="range">
      <button type="button" data-days="7" aria-pressed="false">7 days</button>
      <button type="button" data-days="30" aria-pressed="true">30 days</button>
      <button type="button" data-days="90" aria-pressed="false">90 days</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div id="banner" class="banner" hidden></div>
  <main id="app" aria-live="polite"></main>
</div>

<script>
"use strict";

/* ---------------- helpers ---------------- */

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const c of children.flat()) if (c) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

const isoDate = (offset = 0, from = new Date()) => {
  const d = new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth(), from.getUTCDate()));
  d.setUTCDate(d.getUTCDate() + offset);
  return d.toISOString().slice(0, 10);
};
const dateRange = (days) => Array.from({ length: days }, (_, i) => isoDate(i - days + 1));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDay = (iso) => { const [, m, d] = iso.split("-"); return `${+d} ${MONTHS[+m - 1]}`; };
const fmtInt = (n) => n == null ? "—" : Math.round(n).toLocaleString("en-GB");
function fmtCompact(n) {
  if (n == null || Number.isNaN(n)) return "—";
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (a >= 1e4) return (n / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K";
  return fmtInt(n);
}
const fmtPos = (p, digits = 0) => p == null ? "—" : (digits ? p.toFixed(digits) : String(Math.round(p)));
const fmtPct = (p, digits = 1) => p == null ? "—" : (p * 100).toFixed(digits).replace(/\.0+$/, "") + "%";
const sum = (arr, key) => arr.reduce((t, r) => t + (Number(r[key]) || 0), 0);
function timeAgo(iso) {
  if (!iso) return "never";
  const mins = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 36) return `${hrs} h ago`;
  return `${Math.round(hrs / 24)} days ago`;
}
const pathOf = (url) => { try { const u = new URL(url); return u.pathname + u.search; } catch { return url; } };

/** Splits date-keyed rows into the selected window and the one before it. */
function splitPeriods(rows, days) {
  const start = isoDate(-days + 1), prevStart = isoDate(-days * 2 + 1);
  return {
    current: rows.filter((r) => r.date >= start),
    previous: rows.filter((r) => r.date >= prevStart && r.date < start),
  };
}
function weightedPosition(rows) {
  const impr = sum(rows, "impressions");
  return impr ? rows.reduce((t, r) => t + r.position * r.impressions, 0) / impr : null;
}
/** Percentage change; for "lower is better" metrics the caller flips the sense. */
function delta(curr, prev, { lowerIsBetter = false, absolute = false, digits = 0 } = {}) {
  if (curr == null || prev == null || (!absolute && !prev)) return h("span", { class: "delta flat" }, "no earlier data");
  const diff = absolute ? curr - prev : (curr - prev) / prev;
  const good = lowerIsBetter ? diff < 0 : diff > 0;
  const tiny = absolute ? Math.abs(diff) < 0.05 : Math.abs(diff) < 0.005;
  const cls = tiny ? "flat" : good ? "up" : "down";
  const arrow = tiny ? "→" : diff > 0 ? "↑" : "↓";
  const text = absolute ? Math.abs(diff).toFixed(digits) : (Math.abs(diff) * 100).toFixed(0) + "%";
  return h("span", { class: `delta ${cls}`, title: "Compared with the previous period" }, `${arrow} ${text}`);
}

/* ---------------- charts ---------------- */

function niceStep(range, count) {
  const raw = range / count, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function ticks(max, count = 4) {
  if (!(max > 0)) max = 1;
  const step = niceStep(max, count), out = [];
  for (let v = 0; v <= Math.ceil(max / step) * step + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}

const chartState = new WeakMap();
const resizer = new ResizeObserver((entries) => {
  for (const e of entries) {
    const st = chartState.get(e.target);
    if (st && Math.abs(st.width - e.contentRect.width) > 4) drawLineChart(e.target, st.opts);
  }
});

/**
 * Line chart with crosshair tooltip. series: [{name, color, values (aligned to dates, null = gap)}].
 * invert: rank scale with 1 at the top.
 */
function lineChart(host, opts) {
  host.classList.add("chart");
  drawLineChart(host, opts);
  resizer.observe(host);
}
function drawLineChart(host, opts) {
  const { dates, series, invert = false, fmt = fmtInt, height = 220, label = "Chart" } = opts;
  const width = Math.max(260, host.clientWidth || 600);
  chartState.set(host, { width, opts });
  host.replaceChildren();
  const m = { l: invert ? 32 : 44, r: 12, t: 10, b: 26 };
  const iw = width - m.l - m.r, ih = height - m.t - m.b;
  const all = series.flatMap((sr) => sr.values).filter((v) => v != null);
  if (!all.length) {
    host.append(h("div", { class: "empty" }, opts.emptyText || "No data for this period yet."));
    return;
  }
  let yTicks, y;
  if (invert) {
    // Ranks are whole numbers: step through 1, 2, 5, 10, 20… never 2.5.
    const max = Math.max(10, ...all);
    const step = [1, 2, 5, 10, 20, 25, 50].find((st) => max / st <= 5) || 100;
    yTicks = [1];
    for (let v = step; v < max + step; v += step) yTicks.push(v);
    const top = yTicks[yTicks.length - 1];
    y = (v) => m.t + ((v - 1) / (top - 1)) * ih;
  } else {
    yTicks = ticks(Math.max(...all), 4);
    const top = yTicks[yTicks.length - 1];
    y = (v) => m.t + ih - (v / top) * ih;
  }
  const n = dates.length;
  const x = (i) => m.l + (n === 1 ? iw / 2 : (i * iw) / (n - 1));

  const svg = s("svg", { viewBox: `0 0 ${width} ${height}`, width, height, role: "img", "aria-label": label });
  const grid = s("g", { class: "grid axis" });
  yTicks.forEach((t) => {
    grid.append(s("line", { x1: m.l, x2: width - m.r, y1: y(t), y2: y(t) }));
    grid.append(s("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }, invert ? String(t) : fmtCompact(t)));
  });
  svg.append(grid);
  if (!invert) svg.append(s("line", { class: "baseline", x1: m.l, x2: width - m.r, y1: m.t + ih, y2: m.t + ih }));

  const xAxis = s("g", { class: "axis" });
  const tickCount = Math.min(n, width < 480 ? 3 : 6);
  for (let k = 0; k < tickCount; k++) {
    const i = tickCount === 1 ? 0 : Math.round((k * (n - 1)) / (tickCount - 1));
    const anchor = k === 0 ? "start" : k === tickCount - 1 ? "end" : "middle";
    xAxis.append(s("text", { x: x(i), y: height - 6, "text-anchor": anchor }, fmtDay(dates[i])));
  }
  svg.append(xAxis);

  for (const sr of series) {
    const segs = [];
    let cur = [];
    sr.values.forEach((v, i) => {
      if (v == null) { if (cur.length) segs.push(cur); cur = []; }
      else cur.push([x(i), y(v)]);
    });
    if (cur.length) segs.push(cur);
    for (const seg of segs) {
      const d = seg.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
      if (series.length === 1 && !invert && seg.length > 1) {
        const area = `${d}L${seg[seg.length - 1][0].toFixed(1)},${m.t + ih}L${seg[0][0].toFixed(1)},${m.t + ih}Z`;
        svg.append(s("path", { d: area, fill: sr.color, "fill-opacity": 0.1, stroke: "none" }));
      }
      if (seg.length === 1) svg.append(s("circle", { cx: seg[0][0], cy: seg[0][1], r: 3, fill: sr.color }));
      else svg.append(s("path", { d, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    const last = sr.values.map((v, i) => [v, i]).filter(([v]) => v != null).pop();
    if (last) svg.append(s("circle", { cx: x(last[1]), cy: y(last[0]), r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2 }));
  }

  // hover layer
  const cross = s("line", { class: "crosshair", y1: m.t, y2: m.t + ih, visibility: "hidden" });
  const dots = series.map((sr) => s("circle", { r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
  svg.append(cross, ...dots);
  const hit = s("rect", { x: m.l - 6, y: 0, width: iw + 12, height, fill: "transparent", tabindex: 0 });
  svg.append(hit);
  host.append(svg);
  const tip = h("div", { class: "tooltip", hidden: true });
  host.append(tip);

  const show = (i) => {
    i = Math.max(0, Math.min(n - 1, i));
    host.dataset.idx = i;
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(h("div", { class: "t-date" }, fmtDay(dates[i])));
    series.forEach((sr, k) => {
      const v = sr.values[i];
      if (v == null) dots[k].setAttribute("visibility", "hidden");
      else { dots[k].setAttribute("cx", x(i)); dots[k].setAttribute("cy", y(v)); dots[k].setAttribute("visibility", "visible"); }
      tip.append(h("div", { class: "t-row" },
        h("i", { class: "key", style: `background:${sr.color}` }),
        h("strong", null, v == null ? (sr.nullText || "—") : fmt(v)),
        h("span", null, sr.name)));
    });
    tip.hidden = false;
    const tw = tip.offsetWidth;
    let left = x(i) + 12;
    if (left + tw > width) left = x(i) - tw - 12;
    tip.style.left = Math.max(0, left) + "px";
    tip.style.top = m.t + "px";
  };
  const hide = () => { cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); tip.hidden = true; };
  hit.addEventListener("pointermove", (e) => {
    const rect = svg.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * width;
    show(Math.round(((px - m.l) / iw) * (n - 1)));
  });
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("focus", () => show(n - 1));
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", (e) => {
    const i = Number(host.dataset.idx ?? n - 1);
    if (e.key === "ArrowLeft") { show(i - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show(i + 1); e.preventDefault(); }
  });
}

function sparkline(values, { invert = false, color = "var(--series-1)", width = 92, height = 26 } = {}) {
  const pts = values.map((v, i) => [v, i]).filter(([v]) => v != null);
  const svg = s("svg", { class: "spark", width, height, viewBox: `0 0 ${width} ${height}`, "aria-hidden": "true" });
  if (pts.length < 2) return svg;
  const vals = pts.map(([v]) => v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = 4;
  const x = (i) => pad + (i / (values.length - 1)) * (width - pad * 2);
  const y = (v) => {
    const t = (v - lo) / (hi - lo);
    return invert ? pad + t * (height - pad * 2) : height - pad - t * (height - pad * 2);
  };
  const d = pts.map(([v, i], k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  svg.append(s("path", { d, fill: "none", stroke: color, "stroke-width": 1.5, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.85 }));
  const [lv, li] = pts[pts.length - 1];
  svg.append(s("circle", { cx: x(li), cy: y(lv), r: 2.5, fill: color }));
  return svg;
}

/* ---------------- domain logic ---------------- */

const VITALS = [
  { key: "lcp_ms", name: "Largest Contentful Paint", short: "LCP", good: 2500, poor: 4000, fmt: (v) => (v / 1000).toFixed(2) + " s", goodText: "Good ≤ 2.5 s" },
  { key: "inp_ms", name: "Interaction to Next Paint", short: "INP", good: 200, poor: 500, fmt: (v) => Math.round(v) + " ms", goodText: "Good ≤ 200 ms" },
  { key: "cls", name: "Cumulative Layout Shift", short: "CLS", good: 0.1, poor: 0.25, fmt: (v) => v.toFixed(2), goodText: "Good ≤ 0.1" },
  { key: "ttfb_ms", name: "Time to First Byte", short: "TTFB", good: 800, poor: 1800, fmt: (v) => Math.round(v) + " ms", goodText: "Good ≤ 800 ms" },
];
const rating = (vt, v) => v == null ? null : v <= vt.good ? "good" : v <= vt.poor ? "warning" : "critical";
const RATING_TEXT = { good: "Good", warning: "Needs work", critical: "Poor" };

function avgVitals(rows) {
  const out = {};
  for (const vt of [...VITALS, { key: "page_load_ms" }]) {
    const pts = rows.filter((r) => r[vt.key] != null);
    const w = pts.reduce((t, r) => t + (r.samples || 1), 0);
    out[vt.key] = w ? pts.reduce((t, r) => t + r[vt.key] * (r.samples || 1), 0) / w : null;
  }
  return out;
}

/** Latest position and the position at the start of the window for one rank series. */
function rankSummary(points) {
  const pts = points || [];
  const latest = pts.length ? pts[pts.length - 1].position : null;
  const first = pts.length ? pts[0].position : null;
  return { latest, first, has: pts.length > 0 };
}
function rankChange({ latest, first, has }) {
  if (!has) return h("span", { class: "delta flat" }, "waiting");
  if (latest == null && first == null) return h("span", { class: "delta flat" }, "not ranking");
  if (first == null) return h("span", { class: "delta up" }, "New");
  if (latest == null) return h("span", { class: "delta down" }, "Lost");
  const diff = first - latest;
  if (!diff) return h("span", { class: "delta flat" }, "→ 0");
  return h("span", { class: `delta ${diff > 0 ? "up" : "down"}`, title: `Was ${first}` }, `${diff > 0 ? "↑" : "↓"} ${Math.abs(diff)}`);
}
function posCell(p) {
  return h("span", { class: `pos${p != null && p <= 3 ? " top3" : ""}`, title: p == null ? "Not found in the results checked" : null }, p == null ? "—" : String(p));
}

/** Things worth a look, worked out from the data plus issues found during sync. */
function findIssues(d) {
  const out = [];
  const last = d.uptime.last;
  if (last && !last.ok) out.push({ severity: "critical", kind: "uptime", message: `Website isn't responding (${last.status_code ? "HTTP " + last.status_code : last.error || "no response"})`, url: `https://${d.site.domain}/` });
  const checks = sum(d.uptime.daily, "checks"), up = sum(d.uptime.daily, "up");
  if (checks && up / checks < 0.995) out.push({ severity: "warning", kind: "uptime", message: `Uptime was ${fmtPct(up / checks, 2)} over this period` });

  const v = avgVitals(d.vitals);
  for (const vt of VITALS) {
    const r = rating(vt, v[vt.key]);
    if (r === "critical") out.push({ severity: "warning", kind: "speed", message: `${vt.name} is slow on real visits (${vt.fmt(v[vt.key])})` });
  }

  const recent = d.gsc.filter((r) => r.date >= isoDate(-9));
  const before = d.gsc.filter((r) => r.date < isoDate(-9) && r.date >= isoDate(-16));
  const c1 = sum(recent, "clicks"), c0 = sum(before, "clicks");
  if (c0 >= 20 && c1 < c0 * 0.7) out.push({ severity: "warning", kind: "search", message: `Google clicks fell ${Math.round((1 - c1 / c0) * 100)}% week on week` });

  for (const k of d.keywords) {
    const { latest, first } = rankSummary(k.organic);
    if (first != null && first <= 10 && (latest == null || latest > 10)) {
      out.push({ severity: "warning", kind: "ranking", message: `“${k.keyword}” dropped off Google page one (was ${first})` });
    } else if (first != null && latest != null && latest - first >= 3) {
      out.push({ severity: "info", kind: "ranking", message: `“${k.keyword}” slipped from ${first} to ${latest}` });
    }
  }
  const order = { critical: 0, warning: 1, info: 2 };
  return [...out, ...d.issues].sort((a, b) => order[a.severity] - order[b.severity]);
}

async function call(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { accept: "application/json", ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (HTTP ${res.status})`);
  return data;
}
const liveBackend = {
  mode: "live",
  sites: (days) => call("GET", `api/sites?days=${days}`),
  dashboard: (id, days) => call("GET", `api/sites/${id}/dashboard?days=${days}`),
  createSite: (data) => call("POST", "api/sites", data),
  updateSite: (id, data) => call("PUT", `api/sites/${id}`, data),
  deleteSite: (id) => call("DELETE", `api/sites/${id}`),
  addKeywords: (id, keywords) => call("POST", `api/sites/${id}/keywords`, { keywords }),
  deleteKeyword: (id) => call("DELETE", `api/keywords/${id}`),
  sync: (id) => call("POST", `api/sites/${id}/sync`),
};

  const HIST = 180;
  const days = dateRange(HIST);

  function rankWalk(start, end, { gaps = 0, maxPos = 30 } = {}) {

      let pos = Math.max(1, Math.round(p));

const state = { backend: null, days: 30, view: { name: "overview" }, cache: null, selectedKeyword: null, gscMetric: "clicks" };
try { const d = Number(localStorage.getItem("seo.days")); if ([7, 30, 90].includes(d)) state.days = d; } catch {}

const app = document.getElementById("app");

function setRangeButtons() {
  for (const b of document.querySelectorAll("#range button")) b.setAttribute("aria-pressed", String(Number(b.dataset.days) === state.days));

document.getElementById("range").addEventListener("click", (e) => {

function go(view) {
  state.view = view;
  state.selectedKeyword = null;
  try { history.replaceState(null, "", view.name === "site" ? `#site-${view.id}` : "#"); } catch {}
  render();
  window.scrollTo({ top: 0 });
}

let renderToken = 0;
async function render() {
  const token = ++renderToken;
  document.body.classList.add("loading");
  try {
    if (state.view.name === "site") {
      const data = await state.backend.dashboard(state.view.id, state.days);
      if (token !== renderToken) return;
      app.replaceChildren(...siteView(data));
    } else {
      const data = await state.backend.sites(state.days);
      if (token !== renderToken) return;
      app.replaceChildren(...overviewView(data));
    }
  } catch (err) {
    if (token !== renderToken) return;
    app.replaceChildren(h("div", { class: "panel" }, h("p", { class: "notice error" }, err.message),
      h("button", { class: "btn", type: "button", onclick: () => go({ name: "overview" }) }, "Back to all websites")));
  } finally {
    if (token === renderToken) document.body.classList.remove("loading");
  }
}

function overviewView({ days, sites }) {
  const rows = sites.map((x) => {

    return {
      x,
      visits: sum(t.current, "visits"), visitsPrev: t.previous.length ? sum(t.previous, "visits") : null,

  } }, "Delete website");

  const conn = d.configured || {};
  const connRow = (ok, name, what) => h("li", null, h("span", null, name, h("span", { class: "muted" }, ` · ${what}`)), h("span", { class: `pill ${ok ? "good" : "warning"}` }, ok ? "Connected" : "Not set up"));

  return h("details", { class: "settings band", id: "settings" },
    h("summary", null, "Settings"),
    h("div", { style: "display:grid;gap:16px;margin-top:12px" },
      site.last_sync_error ? h("div", { class: "panel notice error", style: "white-space:pre-wrap" }, `Last sync problems:\n${site.last_sync_error}`) : null,
      h("div", { class: "panel" }, h("h3", { style: "margin-bottom:8px" }, "Data sources"),
        h("ul", { class: "kw-list" },
          connRow(conn.cloudflare, "Cloudflare", "visitors and speed"),
          connRow(conn.searchConsole, "Google Search Console", "clicks, searches, pages, sitemaps"),
          connRow(conn.rankTracking, "DataForSEO", "local Google and Maps positions"))),
      h("div", { class: "panel" }, h("h3", { style: "margin-bottom:12px" }, "Website details"),
        siteForm(site, async (data) => { await state.backend.updateSite(site.id, data); render(); })),
      h("div", { class: "panel", style: "display:grid;gap:12px" }, h("h3", null, `Tracked keywords (${d.keywords.length})`), kwList, addKw),
      h("div", null, del)));
}

/* ---------------- boot ---------------- */

function showBanner(text) {
  const b = document.getElementById("banner");
  b.textContent = text;
  b.hidden = !text;
}

async function boot() {
  setRangeButtons();
  const chip = document.getElementById("mode-chip");
  let live = false;
  try {
    const res = await fetch("api/status", { headers: { accept: "application/json" } });
    live = res.ok && (res.headers.get("content-type") || "").includes("application/json");
  } catch {}
  state.backend = live ? liveBackend : makeDemoBackend();
  chip.textContent = live ? "Live" : "Example data";
  chip.className = `chip ${live ? "live" : "demo"}`;
  if (!live) showBanner("You're looking at example data. Deploy the worker and connect Cloudflare, Search Console and DataForSEO to see your own websites.");
  const m = location.hash.match(/^#site-(\d+)$/);
  state.view = m ? { name: "site", id: Number(m[1]) } : { name: "overview" };
  render();
}
boot();
</script>
